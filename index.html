<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2F6">
<title>Audiobook App</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#F2F5F9;--p:#FFFFFF;--i:#18283A;--o:#2F455C;--m:#536579;--l:#DDE5EE;--s:#C9D5E2;--b:#BFD3EA;--a:#E6EDF5;--t:#DCE8F1;--glass:rgba(255,255,255,.74);--line:rgba(24,40,58,.10);--ai:linear-gradient(120deg,#5B8DEF 0%,#8E7CF3 50%,#46B3C9 100%);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{font-size:16px}
html.ts-S{font-size:14.5px}
html.ts-L{font-size:18px}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#DCE5EE;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--i);-webkit-font-smoothing:antialiased}
#shell{position:relative;flex-shrink:0;border-radius:40px;overflow:hidden;box-shadow:0 30px 80px rgba(24,40,58,.25)}
#app{position:relative;width:390px;height:844px;transform-origin:top left;background:var(--g);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
body.phone{display:block;background:var(--g)}
body.phone #shell{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
body.phone #app{width:100%;height:100%}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.6}
.bg i:nth-child(1){width:320px;height:320px;left:-120px;top:-110px;background:#BFD6F4;animation:drift1 18s ease-in-out infinite alternate}
.bg i:nth-child(2){width:280px;height:280px;right:-120px;top:220px;background:#DCD3F7;animation:drift2 22s ease-in-out infinite alternate}
.bg i:nth-child(3){width:300px;height:300px;left:-70px;bottom:-150px;background:#C8EAF0;animation:drift1 26s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(60px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-80px,60px) scale(.9)}}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid #5B8DEF;outline-offset:2px}
.main{flex:1;min-height:0;overflow-y:auto;padding:24px 20px 20px;display:flex;flex-direction:column;gap:22px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.main>*{flex-shrink:0}
h1{margin:0;font-size:1.8rem;line-height:1.15;font-weight:800;letter-spacing:-.025em}
h2{margin:0;font-size:1.08rem;line-height:1.3;font-weight:800;letter-spacing:-.01em}
p{margin:0}
.sub{font-size:.95rem;line-height:1.45;font-weight:500;color:var(--m)}
.small{font-size:.84rem;line-height:1.4;font-weight:600;color:var(--m)}
.title{font-size:.98rem;line-height:1.3;font-weight:700}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--m)}
.grad{background:var(--ai);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
.aiicon{display:inline-flex}
.aiicon svg{stroke:url(#aiG)}
.stack{display:flex;flex-direction:column;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 30px rgba(24,40,58,.07);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-card::before{content:'';position:absolute;inset:0;border-radius:24px;padding:1.5px;background:var(--ai);background-size:200% 100%;animation:sheen 6s ease-in-out infinite alternate;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.88);font-size:.95rem;font-weight:700;transition:transform .25s var(--ease),background .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(24,40,58,.06);text-decoration:none}
.btn:active{transform:scale(.95)}
.btn.primary,.btn.dark{background:var(--i);color:#fff;border-color:var(--i);box-shadow:0 10px 24px rgba(24,40,58,.22)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:.88rem}
.btn.icon{width:44px;min-height:44px;padding:0}
.btn[aria-pressed="true"]{background:var(--i);color:#fff;border-color:var(--i)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.85);font-size:.9rem;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:background .25s,color .25s,transform .25s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--i);color:#fff;border-color:var(--i)}
.chip.static{min-height:40px;cursor:default;background:var(--glass);border-color:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(24,40,58,.06)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:rgba(24,40,58,.06)}
.seg button{min-height:44px;border:0;border-radius:999px;background:transparent;font-size:.92rem;font-weight:700;color:var(--m);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--i);box-shadow:0 4px 12px rgba(24,40,58,.1)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.75);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 6px 20px rgba(24,40,58,.06);text-align:left}
.rowbtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0;border:0;background:transparent;text-align:left}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:3px 10px;border-radius:999px;background:rgba(24,40,58,.07);font-size:.72rem;font-weight:700;color:var(--i)}
.tag.ai{background:var(--ai);color:#fff}
.field{height:54px;width:100%;padding:0 18px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:1rem;font-weight:600;box-shadow:inset 0 1px 2px rgba(24,40,58,.05)}
.field::placeholder{color:var(--m);opacity:1}
.nav{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0 14px 14px;padding:6px;border-radius:30px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 32px rgba(24,40,58,.14)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;border-radius:24px;background:transparent;font-size:.74rem;font-weight:700;color:var(--m);transition:background .3s var(--ease),color .3s}
.nav button[aria-current="page"]{background:var(--i);color:#fff}
.cover{flex-shrink:0;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;padding:8px;overflow:hidden;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 6px 16px rgba(24,40,58,.14)}
.cover .ct{font-weight:800;letter-spacing:-.02em;line-height:1.12;color:var(--i)}
.cover .ca{font-size:10px;line-height:12px;font-weight:800;color:var(--m)}
.cover.art{align-items:center;justify-content:center;color:var(--i)}
.stackc{display:flex;padding-left:12px}
.stackc .cover{width:34px !important;height:34px !important;margin-left:-12px;border-radius:50%;padding:0;border:2px solid #fff}
.stackc .cover>*{display:none}
.pickhead{display:flex;align-items:center;gap:12px;width:100%;padding:0;border:0;background:transparent;text-align:left}
.chevr{display:inline-flex;color:var(--m);transition:transform .4s var(--ease)}
.mini{display:flex;align-items:center;gap:10px;margin:0 14px 8px;padding:8px 8px 8px 10px;border-radius:24px;background:rgba(24,40,58,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;box-shadow:0 12px 30px rgba(24,40,58,.25)}
.mini .open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:transparent;color:#fff;text-align:left;padding:0}
.mini .t{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--i);display:flex;align-items:center;justify-content:center}
.mini .cover{box-shadow:none}
.bar{height:6px;border-radius:999px;background:rgba(24,40,58,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ai);border-radius:999px}
.mini .bar{height:3px;background:rgba(255,255,255,.2)}
.toast{position:absolute;left:16px;right:16px;bottom:108px;padding:13px 16px;border-radius:18px;background:rgba(24,40,58,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-weight:700;font-size:.92rem;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:30}
.toast.show{opacity:1;transform:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:8px 12px 8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.75);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 6px 20px rgba(24,40,58,.05);text-align:left;font-size:.98rem;font-weight:700}
.sw .trk{display:block;flex-shrink:0;width:52px;height:32px;padding:3px;border-radius:999px;background:rgba(24,40,58,.16);transition:background .3s}
.sw .trk i{display:block;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(24,40,58,.25);transition:margin .35s var(--ease)}
.sw[aria-checked="true"] .trk{background:var(--i)}
.sw[aria-checked="true"] .trk i{margin-left:20px}
.piano{position:relative;height:196px;display:flex;gap:3px;user-select:none;-webkit-user-select:none;touch-action:none}
.wk{flex:1;border:1px solid rgba(24,40,58,.14);border-radius:0 0 12px 12px;background:linear-gradient(#FFFFFF,#EEF2F7);box-shadow:inset 0 -6px 0 rgba(24,40,58,.06),0 4px 10px rgba(24,40,58,.08);display:flex;align-items:flex-end;justify-content:center;padding:0 0 10px;font-size:.72rem;font-weight:700;color:var(--m);transition:transform .08s,background .15s}
.wk.down{background:linear-gradient(#DCE7F8,#C5D6F0);transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(24,40,58,.06)}
.bk{position:absolute;top:0;width:24px;height:116px;margin-left:-12px;padding:0;background:linear-gradient(#34495F,#101C29);border:0;border-radius:0 0 8px 8px;box-shadow:0 6px 12px rgba(16,28,41,.35),inset 0 -5px 0 rgba(255,255,255,.08);z-index:2;transition:transform .08s}
.bk.down{background:linear-gradient(#5B8DEF,#8E7CF3);transform:translateY(2px)}
.words{display:flex;flex-wrap:wrap;gap:4px 2px;padding:14px;border-radius:20px;background:var(--glass);border:1px solid rgba(255,255,255,.75);font-size:1.05rem;line-height:1.75rem;font-weight:600}
.words span{padding:0 3px;border-radius:7px;transition:background .25s}
.words span.on{background:linear-gradient(120deg,rgba(91,141,239,.28),rgba(142,124,243,.28))}
input[type=range]{width:100%;height:44px;accent-color:var(--i)}
.av{display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background:var(--ai);font-weight:800;color:#fff;box-shadow:0 10px 26px rgba(91,141,239,.35)}
.hdr{display:flex;flex-direction:column;gap:14px;padding:20px 20px 18px;background:linear-gradient(135deg,#18283A,#2C4363);color:#fff}
.hdr .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none;align-self:flex-start}
.hdr .sub{color:#C9D5E2}
.gbar{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;font-size:.88rem;font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.keypad button{min-height:62px;border-radius:22px;border:1px solid rgba(255,255,255,.8);background:var(--glass);box-shadow:0 6px 18px rgba(24,40,58,.07);font-size:1.45rem;font-weight:700}
.dots{display:flex;justify-content:center;gap:16px}
.dots i{display:block;width:16px;height:16px;border-radius:50%;background:rgba(24,40,58,.14);transition:background .25s,transform .3s var(--ease)}
.dots i.f{background:var(--i);transform:scale(1.15)}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll button{flex-shrink:0;width:112px;padding:0;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:8px}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.orb{position:relative;width:150px;height:150px;border-radius:50%;background:conic-gradient(from 0deg,#5B8DEF,#8E7CF3,#46B3C9,#5B8DEF);display:flex;align-items:center;justify-content:center;animation:spin 16s linear infinite;box-shadow:0 24px 60px rgba(91,141,239,.35);margin-bottom:8px}
.orb::after{content:'';position:absolute;inset:7px;border-radius:50%;background:rgba(255,255,255,.78)}
.orb span{position:relative;z-index:1;display:flex;animation:spin 16s linear infinite reverse;color:var(--i)}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{position:absolute;left:50%;top:30px;width:360px;height:360px;margin-left:-180px;border-radius:50%;filter:blur(70px);opacity:.75;z-index:-1;pointer-events:none}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.eq i{display:block;width:3px;height:4px;border-radius:2px;background:currentColor;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.enter .main>*{animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--d,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px);filter:blur(6px)}}
.unfold{animation:unfold .8s var(--ease) backwards;animation-delay:calc(var(--d,0) * 110ms + 80ms)}
@keyframes unfold{0%{opacity:0;transform:scale(.86) translateY(-14px);filter:blur(10px)}55%{opacity:1}}
.wv{transition:transform .55s var(--ease)}
.rv{opacity:0;translate:0 26px;transition:opacity .7s var(--ease),translate .7s var(--ease)}
.rv.in{opacity:1;translate:0 0}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.rp{position:absolute;border-radius:50%;border:1.5px solid rgba(91,141,239,.5);background:radial-gradient(circle,rgba(142,124,243,.16),rgba(91,141,239,0) 70%);transform:translate(-50%,-50%) scale(0);animation:rp .8s var(--ease) forwards}
@keyframes rp{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.sheet-back{position:absolute;inset:0;z-index:20;background:rgba(24,40,58,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .3s both;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:rgba(248,250,252,.97);border-radius:30px 30px 0 0;padding:10px 20px 26px;max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;animation:up .5s var(--ease) both;box-shadow:0 -20px 50px rgba(24,40,58,.2)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(24,40,58,.2);align-self:center;margin-bottom:4px}
.sheet .chip[aria-pressed="true"]{animation:pop .35s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{50%{transform:scale(1.08)}}
.calm *,.calm *::before,.calm *::after{animation:none !important;transition:none !important}
.calm .rv{opacity:1;translate:0 0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.rv{opacity:1;translate:0 0}}
.hand{font-family:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;font-weight:600;letter-spacing:0}
.hi{font-size:1.5rem;line-height:1;color:var(--o)}
h1.big{font-size:2.3rem;line-height:1.03;letter-spacing:-.045em;font-weight:800}
.big2{font-size:1.7rem;line-height:1.05;letter-spacing:-.035em;font-weight:800;margin:0}
.sect{font-size:1.7rem;line-height:1;font-weight:700;margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0 20px;flex-shrink:0}
.topbar .date{font-size:1.25rem;color:var(--m)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.avs{width:40px;height:40px;border-radius:50%;border:0;background:var(--i);color:#fff;font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.avs.lg{width:42px;height:42px;background:var(--ai);font-size:1rem}
.link{white-space:nowrap;border:0;background:none;padding:10px 4px;font-weight:700;font-size:.9rem;color:var(--o);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.pola{position:relative;display:inline-flex;flex-direction:column;flex-shrink:0;background:#fff;padding:7px 7px 0;border-radius:3px;box-shadow:0 1px 2px rgba(24,40,58,.08),0 14px 30px rgba(24,40,58,.17);transform:rotate(var(--r,-2deg));transition:transform .5s var(--ease)}
.pola::before{content:'';position:absolute;top:-5px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#6B7C8F,#18283A 68%);box-shadow:0 3px 5px rgba(0,0,0,.32);z-index:2}
.pola .cover{border-radius:2px;box-shadow:inset 0 0 0 1px rgba(24,40,58,.06)}
.pola .cap{font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-weight:600;font-size:1.15rem;line-height:1.02;padding:6px 3px 9px;color:var(--i);max-width:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pola .cap small{display:block;font-size:.88rem;color:var(--m);overflow:hidden;text-overflow:ellipsis}
button:active .pola{transform:rotate(0deg) scale(.97)}
.hscroll.pol{gap:18px;padding:18px 22px 34px;margin:-6px -20px -22px}
.hscroll.pol button{width:auto}
.hscroll .pcard{width:150px;min-height:132px;padding:14px;border-radius:20px;border:1px solid rgba(255,255,255,.8);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 6px 20px rgba(24,40,58,.07);gap:4px}
.who{font-size:1.3rem;line-height:1;color:var(--i)}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tag.you{background:#5B6BEF;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:.62rem;padding:2px 7px;vertical-align:middle;letter-spacing:.04em}
.now{padding:20px 16px 16px}
.nowbtn{display:flex;align-items:center;gap:18px;width:100%;padding:0;border:0;background:transparent;text-align:left}
.stats{display:flex;gap:24px}
.stats>span{display:flex;flex-direction:column;font-size:.74rem;font-weight:600;color:var(--m)}
.stats b{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;line-height:1.05;color:var(--i)}
.stats.light>span{color:#C9D5E2}.stats.light b{color:#fff}
.empty{font-size:1.45rem;color:var(--m);text-align:center;padding:10px 0 0;margin:0}
.field.pill{border-radius:999px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.steps li{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;font-size:.82rem;font-weight:700;color:var(--m);border-radius:999px;background:rgba(24,40,58,.05);transition:background .35s,color .35s}
.steps li i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(24,40,58,.1);font-size:.72rem}
.steps li.on{background:var(--i);color:#fff}.steps li.on i{background:rgba(255,255,255,.22)}
.steps li.done{color:var(--i)}.steps li.done i{background:#2E9E6A;color:#fff}
.recdot{width:9px;height:9px;border-radius:50%;background:#E5484D;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.rate{display:flex;align-items:center;gap:10px;margin-top:4px}
.rate b{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1;background:var(--ai);-webkit-background-clip:text;background-clip:text;color:transparent}
.rate>span{display:flex;flex-direction:column}
.stars{color:#5B6BEF;letter-spacing:2px;font-size:.9rem}
.summary{gap:8px}
.summary .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.summary ul{margin:6px 0 0;padding-left:16px;font-size:.88rem;font-weight:600;line-height:1.45;color:var(--o)}
.replies{gap:6px !important;padding-top:4px;border-top:1px solid var(--line)}
.replies li{font-size:.9rem;font-weight:600;color:var(--o);padding-top:6px}
.replies .hand{font-size:1.15rem;color:var(--i);margin-right:4px}
.fresh{animation:fresh 2.4s var(--ease)}
@keyframes fresh{0%{box-shadow:0 0 0 3px rgba(91,141,239,.55),0 10px 30px rgba(24,40,58,.07)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 30px rgba(24,40,58,.07)}}
.ob{padding:20px 24px 28px;gap:24px}
.obbar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.obbar i{display:block;height:4px;border-radius:2px;background:rgba(24,40,58,.12);transition:background .5s}
.obbar i.on{background:var(--i)}
.collage{position:relative;height:200px;margin:4px -6px 0}
.collage .pola{position:absolute}
.collage .pola:nth-child(1){left:6px;top:28px}
.collage .pola:nth-child(2){left:50%;margin-left:-62px;top:4px;z-index:2}
.collage .pola:nth-child(3){right:6px;top:46px}
.enter .collage .pola{animation:drop .9s var(--ease) backwards}
.enter .collage .pola:nth-child(2){animation-delay:.12s}.enter .collage .pola:nth-child(3){animation-delay:.24s}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(0deg)}}
.obfoot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.btn.big{min-height:58px;font-size:1.05rem}
.chip.pick[aria-pressed="true"]{animation:pop .35s var(--ease)}
.toast{left:50%;right:auto;width:max-content;max-width:340px;transform:translate(-50%,12px);background:#0F1720;border-radius:14px;padding:12px 18px 12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.toast.show{transform:translate(-50%,0)}
.toast .dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;margin-top:6px;flex-shrink:0}
.toast .tt{display:flex;flex-direction:column;gap:1px}
.toast .tt span{font-weight:500;color:#AEBBC9;font-size:.84rem}


/* v4: intro, sign-up, tour, pick feedback */
.intro{padding:16px 24px 28px;gap:18px}
.introtop{display:flex;justify-content:flex-end;min-height:44px}
.introart{height:236px;position:relative;display:flex;align-items:center;justify-content:center}
.introdots{display:flex;gap:7px}
.introdots i{display:block;width:8px;height:8px;border-radius:4px;background:rgba(24,40,58,.16);transition:width .35s var(--ease),background .35s}
.introdots i.on{width:24px;background:var(--i)}
.introfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nextbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--i);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px rgba(24,40,58,.25)}
.mockai{width:270px;padding:18px;border-radius:24px;background:#fff;box-shadow:0 16px 40px rgba(24,40,58,.14);display:flex;flex-direction:column;gap:12px}
.mockai .r{display:flex;align-items:center;gap:10px}
.mockai .ln{height:9px;border-radius:5px;background:rgba(24,40,58,.10)}
.mockkeys{display:flex;gap:4px;padding:10px;border-radius:20px;background:#fff;box-shadow:0 16px 40px rgba(24,40,58,.14);position:relative}
.mockkeys i{display:block;width:26px;height:110px;border-radius:0 0 8px 8px;background:linear-gradient(#fff,#EEF2F7);box-shadow:inset 0 0 0 1px rgba(24,40,58,.10)}
.mockkeys i.k{background:var(--ai);box-shadow:none}
.mockpost{position:absolute;right:-34px;bottom:-26px;width:170px;padding:12px;border-radius:16px;background:#fff;box-shadow:0 14px 30px rgba(24,40,58,.16);display:flex;flex-direction:column;gap:4px;transform:rotate(3deg)}
.flabel{font-size:.86rem;font-weight:800;color:var(--i)}
.field.bad{border-color:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.12)}
.err{color:#D13F45;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:6px;margin:0}
.err::before{content:'!';display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#E5484D;color:#fff;font-size:.7rem;font-weight:900}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
.fb .q{font-size:.9rem;font-weight:700;color:var(--i)}
.fb .btns{display:flex;gap:8px}
.fb .btn{min-height:40px;padding:0 14px}
.fb.done{justify-content:flex-start;color:#2E8B60;font-weight:700;font-size:.88rem}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;border:1px solid var(--line);background:#fff;min-height:72px}
.opt .av{width:44px;height:44px;border-radius:14px;flex-shrink:0}
#tour{position:absolute;inset:0;z-index:60}
#tour .spot{position:absolute;border-radius:22px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 9999px rgba(12,20,30,.58);transition:all .45s var(--ease);pointer-events:none}
#tour .bub{position:absolute;left:16px;right:16px;padding:18px;border-radius:22px;background:#fff;box-shadow:0 20px 44px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;transition:top .45s var(--ease)}
#tour .bub b{font-size:1.08rem;color:var(--i)}
#tour .bub p{margin:0;font-size:.92rem;font-weight:600;color:var(--o);line-height:1.4}
#tour .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
#tour .tdots{display:flex;gap:6px}
#tour .tdots i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(24,40,58,.18)}
#tour .tdots i.on{background:var(--i)}

/* one font everywhere */
.hand,.pola .cap,.tag.you{font-family:inherit;letter-spacing:-.01em}
.hi{font-size:1rem;font-weight:600;line-height:1.3;color:var(--m)}
.sect{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.topbar .date{font-size:.9rem;font-weight:700;color:var(--m)}
.pola .cap{font-size:.8rem;font-weight:700;line-height:1.25;padding:7px 2px 9px}
.pola .cap small{font-size:.72rem;font-weight:600}
.who{font-size:1rem;font-weight:800}
.empty{font-size:1rem;font-weight:700}
.replies .hand{font-size:.9rem;font-weight:800}
.summary .sect{font-size:1.2rem !important}
</style>
</head>

    io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { root: sc, threshold: 0.08 });
    Array.prototype.forEach.call(rvs, function (el) { io.observe(el); });
  }
  if (!sc) return;
  let last = sc.scrollTop, t = 0;
  sc.addEventListener('scroll', function () {
    const dy = sc.scrollTop - last; last = sc.scrollTop;
    if (calm()) return;
    const off = Math.max(-18, Math.min(18, -dy * 1.4));
    waves.forEach(function (el) { el.style.transform = 'translateY(' + off + 'px)'; });
    clearTimeout(t);
    t = setTimeout(function () { waves.forEach(function (el) { el.style.transform = ''; }); }, 70);
  }, { passive: true });
}
let toastTimer = 0;
function toast(msg, sub) { const t = document.getElementById('toast'); t.innerHTML = '<i class="dot"></i><span class="tt"><b>' + esc(msg) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>'; t.style.bottom = (document.querySelector('.mini') ? 168 : document.querySelector('.nav') ? 108 : 32) + 'px'; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600); }

/* ---------- actions ---------- */
const A = {

  },
  obpindel: function () { S.obPin = S.obPin.slice(0, -1); },

  tourskip: function () { S.tour = null; },
  fblike: function () { S.pickFb = 'liked'; toast('Thanks!', 'We\'ll suggest more things like these'); },
  fbno: function () { S.fbOpen = true; },
  fbclose: function () { S.fbOpen = false; },

  replay: function () { pauseIfPlaying(); S.screen = 'welcome'; S.ob = 0; S.obErr = {}; S.tour = null; },
  gosearch: function () { S.screen = 'tabs'; S.tab = 'library'; render(); const q = document.getElementById('q'); if (q) q.focus(); return false; },
  gocommunity: function () { S.tab = 'create'; S.createTab = 'community'; },
  pubopen: function () { S.pubOpen = true; },
  pubclose: function () { A.recpause(); S.pubOpen = false; },
  tab: function (v) { S.screen = 'tabs'; S.tab = v; },
  open: function (v) { open(v, false); return false; },
  play: function (v) { open(v, true); return false; },
  toggle: function () { if (S.playing) pause(); else play(); },
  restart: function () { const it = cur(); const was = S.playing; pause(); S.pos = 0; S.wordIdx = 0; if (was) play(); },
  closeplayer: function () { S.screen = 'tabs'; },
  fav: function (v) { if (S.favs.has(v)) S.favs.delete(v); else { S.favs.add(v); toast('Saved', 'Find it in Favourites on Home'); } },
  notforme: function (v) {

  },
  libtab: function (v) { S.libTab = v; },
  bookcat: function (v) { S.bookCat = v; },

  like: function (v) { const p = S.posts.find(function (x) { return x.id === v; }); p.liked = !p.liked; p.likes += p.liked ? 1 : -1; },
  replyopen: function (v) { S.replyOpen = S.replyOpen === v ? null : v; },
  reply: function (v) { const parts = v.split('|'); const p = S.posts.find(function (x) { return x.id === parts[0]; }); p.replies.push({ who: 'You', text: parts[1] }); S.replyOpen = null; toast('Reply sent'); },
  recstart: function () { if (!audio()) return; pauseIfPlaying(); S.pubOpen = false; S.rec = { state: 'rec', notes: [], t0: now(), heard: false }; clearInterval(recTimer); recTimer = setInterval(recStatus, 250); },
  recstop: function () { S.rec.state = 'idle'; clearInterval(recTimer); if (!S.rec.notes.length) toast('Nothing recorded', 'Tap some keys while recording.'); else S.pubOpen = true; },
  recplay: function () {
    if (!S.rec.notes.length) { toast('Record a piece first.'); return; }
    if (!audio()) return;
    pauseIfPlaying();
    if (!pianoBus) { pianoBus = ctx.createGain(); pianoBus.connect(master); }
    pianoBus.gain.value = S.pvol / 100;
    const t0 = now() + 0.05; S.rec.state = 'play'; S.rec.heard = true;
    S.rec.bus = ctx.createGain(); S.rec.bus.connect(pianoBus);
    S.rec.notes.forEach(function (n) { tone(n.m, t0 + n.t, n.d, 1, S.rec.bus); });

  recpause: function () { if (S.rec.bus) { try { S.rec.bus.disconnect(); } catch (e) { } } S.rec.state = 'idle'; clearTimeout(recTimer); },
  recclear: function () { A.recpause(); S.rec.notes = []; S.rec.heard = false; S.pieceName = ''; S.pubOpen = false; },
  metro: function () { S.metro = !S.metro; setMetro(); },

  nameedit: function () { S.editName = true; S.newName = who(); },
  namecancel: function () { S.editName = false; },
  namesave: function () { S.name = S.newName.trim() || S.name; S.editName = false; saveUser(); },
  interest: function (v) { if (S.interests.has(v)) S.interests.delete(v); else S.interests.add(v); },
  settings: function () { S.screen = 'settings'; },
  caregiver: function () { S.screen = 'pin'; S.pin = ''; S.pinErr = false; },
  toMe: function () { S.screen = 'tabs'; S.tab = 'me'; },
  speed: function (v) { S.speed = v; const it = cur(); if (it && it.type === 'book' && S.playing) { pause(); play(); } },
  calm: function () { S.calm = !S.calm; },
  showwords: function () { S.showWords = !S.showWords; },
  textsize: function (v) { S.textSize = v; },
  pin: function (v) { S.pinErr = false; if (S.pin.length < 4) S.pin += v; if (S.pin.length === 4) { if (S.userPin && S.pin !== S.userPin) { S.pinErr = true; S.pin = ''; } else { S.screen = 'caregiver'; S.pin = ''; } } },
  pindel: function () { S.pin = S.pin.slice(0, -1); },
  picks: function () { S.pickOpen = !S.pickOpen; S.pickAnim = S.pickOpen; },
  intedit: function () { S.tmpInt = new Set(S.interests); S.editInt = true; },
  inttoggle: function (v) { if (S.tmpInt.has(v)) S.tmpInt.delete(v); else S.tmpInt.add(v); },
  intsave: function () { S.interests = new Set(S.tmpInt); S.editInt = false; saveUser(); toast('Interests saved', 'Your picks on Home will change'); },
  intcancel: function () { S.editInt = false; },
  noop: function () { return false; },
  sugg1: function (v) { S.sugg1 = v === 'yes' ? 'Done. The AI will keep suggesting these.' : 'OK. Nothing changed.'; },
  sugg2: function (v) {

    if (v === 'yes') { skipped.forEach(function (g) { S.blockedGenres.add(g); }); S.sugg2 = 'Done. The AI will not suggest ' + listText(skipped, 'or') + ' music.'; }
    else S.sugg2 = 'OK. Nothing changed.';
  },
  hideitem: function (v) { if (S.hidden.has(v)) S.hidden.delete(v); else S.hidden.add(v); },
  lock: function () { S.locked = !S.locked; },
  community: function () { S.community = !S.community; },
  sharing: function () { S.sharing = !S.sharing; },
  loudsafe: function () { S.loudSafe = !S.loudSafe; },
  limit: function (v) { S.limit = v; },

const appEl = document.getElementById('app');

  else if (k === 'email') { S.email = v; if (S.obErr && S.obErr.email && EMAIL_RE.test(v.trim())) { S.obErr.email = ''; e.target.classList.remove('bad'); const m = document.getElementById('emErr'); if (m) m.remove(); } }
  else if (k === 'newname') S.newName = v;
  else if (k === 'piece') S.pieceName = v;

});

/* ---------- fit to screen ---------- */
function fit() {
  const phone = window.innerWidth <= 500;
  document.body.classList.toggle('phone', phone);
  const s = phone ? 1 : Math.min(1, (window.innerHeight - 32) / 844, (window.innerWidth - 32) / 390);
  const shell = document.getElementById('shell');
  shell.style.width = phone ? '' : (390 * s) + 'px';
  shell.style.height = phone ? '' : (844 * s) + 'px';
  appEl.style.transform = phone ? '' : 'scale(' + s + ')';
}
