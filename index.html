<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2F6">
<title>Audiobook App</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#26394A;text-decoration:none}a:hover{color:#26394A}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#4A5F73;opacity:1}
a:focus-visible,button:focus-visible{outline:3px solid #26394A;outline-offset:3px}
</style>
<style>
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#D6E2EC}
#shell{position:relative;flex-shrink:0;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(38,57,74,.22)}
#app{width:390px;height:844px;transform-origin:top left}
body.phone{display:block;background:#EDF2F6}
body.phone #shell{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
body.phone #app{width:100%;height:100%}
body.phone #app>div{width:100% !important;height:100% !important}
</style>
</head>
<body>
<div id="shell"><div id="app"></div></div>
<template id="tpl">
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; background: #EDF2F6; color: #26394A; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column">
<main style="flex: 1; min-height: 0; overflow-y: auto">
<sc-if value="{{ isWelcome }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg viewBox="0 0 240 170" width="212" height="150" role="img" aria-label="An open book with sound waves above it" style="display: block">
<path d="M84 34a52 52 0 0 1 72 0" fill="none" stroke="#7FA6C6" stroke-width="5" stroke-linecap="round"></path>
<path d="M97 48a33 33 0 0 1 46 0" fill="none" stroke="#7FA6C6" stroke-width="5" stroke-linecap="round"></path>
<path d="M109 61a16 16 0 0 1 22 0" fill="none" stroke="#7FA6C6" stroke-width="5" stroke-linecap="round"></path>
<path d="M120 84C96 70 66 68 34 74v78c32-6 62-4 86 10z" fill="#FFFFFF" stroke="#3B5568" stroke-width="3" stroke-linejoin="round"></path>
<path d="M120 84c24-14 54-16 86-10v78c-32-6-62-4-86 10z" fill="#DCE8F1" stroke="#3B5568" stroke-width="3" stroke-linejoin="round"></path>
<path d="M52 92c16-2 32 0 48 6M52 108c16-2 32 0 48 6M52 124c16-2 32 0 48 6" fill="none" stroke="#BCCBD8" stroke-width="3" stroke-linecap="round"></path>
<path d="M140 98c16-6 32-8 48-6M140 114c16-6 32-8 48-6M140 130c16-6 32-8 48-6" fill="none" stroke="#BCCBD8" stroke-width="3" stroke-linecap="round"></path>
</svg>
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 800; text-align: center">Audiobook App</h1>
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73; text-align: center">Calm stories to listen to.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="app-name" style="font-size: 18px; line-height: 24px; font-weight: 800">What is your name?</label>
<input id="app-name" type="text" value="{{ name }}" onChange="{{ onName }}" placeholder="Type your name" style="height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: #FFFFFF; border: 2px solid #3B5568; font-family: inherit; font-size: 18px; font-weight: 700; color: #26394A">
</div>
<button type="button" onClick="{{ start }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-radius: 22px; background: #A9C3D9; border: 2px solid #3B5568; box-shadow: 0 4px 0 #3B5568; font-size: 20px; font-weight: 800; color: #26394A; text-decoration: none; width: 100%">
<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
<span>{{ startLabel }}</span>
</button>
<sc-if value="{{ firstRun }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ goPin }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; border-radius: 20px; background: #FFFFFF; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; font-size: 17px; font-weight: 800; color: #26394A; text-decoration: none; width: 100%; height: 52px">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg>
<span>For grown-ups</span>
</button>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 20px">
<header style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 800">{{ hello }}</h1>
<p style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; color: #4A5F73">What would you like to hear?</p>
</header>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800">Now playing</h2>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 24px; background: #FFFFFF; border: 2px solid #D2DDE6">
<div style="display: flex; align-items: center; gap: 14px">
<img src="{{ curCover }}" alt="{{ curAlt }}" style="display: block; flex-shrink: 0; box-sizing: border-box; border: 2px solid #3B5568; object-fit: cover; width: 88px; height: 88px; border-radius: 18px">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800">{{ curTitle }}</p>
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73">{{ curPart }}</p>
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73">{{ curStop }}</p>
</div>
</div>
<div role="img" aria-label="{{ curBar }}" style="height: 14px; box-sizing: border-box; border-radius: 8px; border: 2px solid #3B5568; background: #DFE8EF; overflow: hidden">
<div style="width: {{ curPct }}; height: 100%; background: #A9C3D9"></div>
</div>
<button type="button" onClick="{{ resume }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-radius: 22px; background: #A9C3D9; border: 2px solid #3B5568; box-shadow: 0 4px 0 #3B5568; font-size: 20px; font-weight: 800; color: #26394A; text-decoration: none; width: 100%">
<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
<span>Continue listening</span>
</button>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800; display: flex; align-items: center; gap: 8px"><svg viewBox="0 0 24 24" width="24" height="24" fill="#E79AA8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.2 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg><span>Favourites</span></h2>
<button type="button" onClick="{{ goFavs }}" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; box-sizing: border-box; padding: 0 10px 0 14px; border-radius: 14px; background: #FFFFFF; border: 2px solid #3B5568; font-size: 15px; font-weight: 800; color: #26394A">
<span>See all</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
<sc-if value="{{ hasFavs }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px">
<sc-for list="{{ favs }}" as="b" hint-placeholder-count="2">
<button type="button" onClick="{{ b.open }}" style="display: flex; flex-direction: column; gap: 6px; width: 104px; flex-shrink: 0; padding: 0; border: 0; background: transparent; color: #26394A; text-align: left">
<img src="{{ b.cover }}" alt="{{ b.alt }}" style="display: block; flex-shrink: 0; box-sizing: border-box; border: 2px solid #3B5568; object-fit: cover; width: 104px; height: 104px; border-radius: 18px">
<span style="font-size: 14px; line-height: 18px; font-weight: 800">{{ b.title }}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ noFavs }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73">No favourites yet. Open a book and tap the heart.</p>
</sc-if>
</section>
<sc-if value="{{ sugOn }}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800">Recommended for you</h2>
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73">{{ recText }}</p>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ recs }}" as="b" hint-placeholder-count="3">
<li>
<button type="button" onClick="{{ b.open }}" style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 10px; border-radius: 22px; background: #FFFFFF; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; color: #26394A; text-decoration: none; width: 100%; text-align: left">
<img src="{{ b.cover }}" alt="{{ b.alt }}" style="display: block; flex-shrink: 0; box-sizing: border-box; border: 2px solid #3B5568; object-fit: cover; width: 72px; height: 72px; border-radius: 16px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; line-height: 23px; font-weight: 800">{{ b.title }}</span>
<span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #4A5F73">{{ b.author }}</span>
<span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #4A5F73">{{ b.cat }}</span>
</span>
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</li>
</sc-for>
</ul>
</section>
</sc-if>
<sc-if value="{{ sugOff }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73">Suggestions are off. You can turn them on in Me, under My interests.</p>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ isLibrary }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 20px">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 800">Library</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="app-search" style="font-size: 16px; line-height: 22px; font-weight: 800">Search</label>
<div style="display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; background: #FFFFFF; border: 2px solid #3B5568">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<input id="app-search" type="search" value="{{ q }}" onChange="{{ onSearch }}" placeholder="Book name or writer" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 18px; font-weight: 700; color: #26394A">
</div>
</div>
<sc-if value="{{ searching }}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73; font-weight: 800">{{ resultText }}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ results }}" as="b" hint-placeholder-count="3">
<li>
<button type="button" onClick="{{ b.open }}" style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 10px; border-radius: 22px; background: #FFFFFF; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; color: #26394A; text-decoration: none; width: 100%; text-align: left">
<img src="{{ b.cover }}" alt="{{ b.alt }}" style="display: block; flex-shrink: 0; box-sizing: border-box; border: 2px solid #3B5568; object-fit: cover; width: 72px; height: 72px; border-radius: 16px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; line-height: 23px; font-weight: 800">{{ b.title }}</span>
<span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #4A5F73">{{ b.author }}</span>
<span style="font-size: 15px; line-height: 20px; font-weight: 600; color: #4A5F73">{{ b.cat }}</span>
</span>
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{ browsing }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" onClick="{{ goFavs }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; border-radius: 20px; background: #FFFFFF; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; font-size: 17px; font-weight: 800; color: #26394A; text-decoration: none; width: 100%">
<svg viewBox="0 0 24 24" width="24" height="24" fill="#E79AA8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.2 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
<span>Favourites</span>
</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; border-radius: 20px; background: #FFFFFF; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; font-size: 17px; font-weight: 800; color: #26394A; text-decoration: none; width: 100%">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7.5 11 12 15.5 16.5 11"></path><path d="M5 19.5h14"></path></svg>
<span>Downloads</span>
</button>
</div>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800">Kinds of books</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" onClick="{{ openCat0 }}" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; min-height: 132px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #C9DCEB; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; color: #26394A; text-align: left">
<svg style="flex-shrink: 0" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l2.3 4.9 5.2.7-3.8 3.7.9 5.3L12 16l-4.6 2.6.9-5.3L4.5 9.6l5.2-.7z"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; line-height: 22px; font-weight: 800">Fairy Tales</span><span style="font-size: 14px; line-height: 18px; font-weight: 700; color: #4A5F73">Fairy tales and myths</span></span>
</button>
<button type="button" onClick="{{ openCat1 }}" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; min-height: 132px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #D9D4EC; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; color: #26394A; text-align: left">
<svg style="flex-shrink: 0" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"></path><path d="M12 6.5v13"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; line-height: 22px; font-weight: 800">Novels</span><span style="font-size: 14px; line-height: 18px; font-weight: 700; color: #4A5F73">Adventure, science fiction</span></span>
</button>
<button type="button" onClick="{{ openCat2 }}" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; min-height: 132px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #D3E6D6; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; color: #26394A; text-align: left">
<svg style="flex-shrink: 0" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17"></path><path d="M12 3.5c3.2 3 3.2 14 0 17"></path><path d="M12 3.5c-3.2 3-3.2 14 0 17"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; line-height: 22px; font-weight: 800">Facts and Science</span><span style="font-size: 14px; line-height: 18px; font-weight: 700; color: #4A5F73">Animals, science, history</span></span>
</button>
<button type="button" onClick="{{ openCat3 }}" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; min-height: 132px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #F0E0CC; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; color: #26394A; text-align: left">
<svg style="flex-shrink: 0" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 17.5V6l9-2v11.5"></path><circle cx="7" cy="17.5" r="2.5"></circle><circle cx="16" cy="15.5" r="2.5"></circle></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; line-height: 22px; font-weight: 800">Poems and Songs</span><span style="font-size: 14px; line-height: 18px; font-weight: 700; color: #4A5F73">Poems and rhymes</span></span>
</button>
</div>
</section>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 20px">
<button type="button" onClick="{{ back }}" style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 16px; background: #FFFFFF; border: 2px solid #3B5568; font-size: 16px; font-weight: 800; color: #26394A">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
<span>Library</span>
</button>
<header style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 800">{{ catTitle }}</h1>
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; color: #4A5F73">{{ catHint }}</p>
</header>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ catBooks }}" as="b" hint-placeholder-count="3">
<li>
<button type="button" onClick="{{ b.open }}" style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 10px; border-radius: 22px; background: #FFFFFF; border: 2px solid #3B5568; box-shadow: 0 3px 0 #BCCBD8; color: #26394A; text-decoration: none; width: 100%; text-align: left">
<img src="{{ b.cover }}" alt="{{ b.alt }}" style="display: block; flex-shrink: 0; box-sizing: border-box; border: 2px solid #3B5568; object-fit: cover; width: 72px; height: 72px; border-radius: 16px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
